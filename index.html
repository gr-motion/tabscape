<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabscape</title>
  <style>
    @font-face {
      font-family: 'Söhne';
      src: url('/_assets/Soehne-Buch.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Söhne', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0E0E0C;
      color: #FFFEF7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 260px;
    }
    .logo {
      display: block;
      width: 28px;
      height: auto;
      margin-bottom: 12px;
    }
    a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 38px;
      border: 1px solid #FFFEF7;
      border-radius: 64px;
      background: transparent;
      color: #FFFEF7;
      font-family: 'Söhne', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      text-decoration: none;
      transition: background 0.15s;
    }
    a:hover { background: rgba(255, 254, 247, 0.08); }
    a:active { background: rgba(255, 254, 247, 0.15); }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="/_assets/Opera_Logo.svg" alt="Opera">
    <a href="/tabscape/">Tabscape</a>
    <a href="/loop-generator-v4/">Loop Generator</a>
  </div>
</body>
</html>
